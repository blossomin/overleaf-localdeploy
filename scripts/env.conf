######################################################################
# env.conf - Overleaf 部署全局环境变量配置
# 所有脚本启动时会自动 source 此文件
# 修改此文件后，新的值会在下次脚本执行时生效
######################################################################

# ---- 基础路径 ----
export OVERLEAF_BASE_DIR="/home/dchen/projects/overleaf"

# ---- Overleaf 服务端口 ----
# 内部端口：Overleaf 容器监听端口，绑定在 127.0.0.1，仅供 NGINX 反向代理使用
# 外部用户不直接访问此端口，无需在防火墙开放
export OVERLEAF_PORT="8080"

# ---- 对外端口 ----
# HTTPS 端口：用户实际访问的端口（需在防火墙开放）
export TLS_PORT="${TLS_PORT:-443}"
# HTTP 端口：用于 HTTP→HTTPS 自动重定向（可选，设为空则不开放）
export NGINX_HTTP_PORT="${NGINX_HTTP_PORT:-80}"

# ---- 网络配置（部署时由 deploy-all.sh 覆盖）----
export PUBLIC_IP="${PUBLIC_IP:-}"
export DOMAIN="${DOMAIN:-}"
export ADMIN_EMAIL="${ADMIN_EMAIL:-admin@example.com}"

# ---- TLS 配置 ----
export TLS_MODE="${TLS_MODE:-self-signed}"   # self-signed | letsencrypt

# ---- GitHub 同步配置 ----
export GITHUB_TOKEN="${GITHUB_TOKEN:-}"
export GITHUB_USER="${GITHUB_USER:-}"
export REPO_VISIBILITY="${REPO_VISIBILITY:-private}"
export SYNC_INTERVAL="${SYNC_INTERVAL:-30}"   # 分钟

# ======== 以下为派生路径，通常无需修改 ========
export TOOLKIT_DIR="${OVERLEAF_BASE_DIR}/overleaf-toolkit"
export SYNC_DIR="${OVERLEAF_BASE_DIR}/github-sync"
export REPOS_DIR="${OVERLEAF_BASE_DIR}/github-repos"
export SCRIPTS_DIR="${OVERLEAF_BASE_DIR}/scripts"
export LOGS_DIR="${OVERLEAF_BASE_DIR}/logs"
